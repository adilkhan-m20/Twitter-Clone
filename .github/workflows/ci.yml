name: Twitter Clone CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # --- Job 1: Build, Scan & Push Backend ---
  build-backend:
    name: Build & Scan Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Dependency Scanning (SCA)
      - name: Backend Dependency Scan (npm audit)
        working-directory: ./backend
        run: npm audit --audit-level=high || true

      # 2. Build Image
      - name: Build Backend Docker Image
        working-directory: ./backend
        run: docker build -t adilkhan22/twitter-backend:latest .

      # 3. Container Scanning
      - name: Trivy Container Scan (Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "adilkhan22/twitter-backend:latest"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Push Image to Docker Hub
      - name: Push Backend Image
        run: docker push adilkhan22/twitter-backend:latest

  # --- Job 2: Build, Scan & Push Frontend ---
  build-frontend:
    name: Build & Scan Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Dependency Scanning (SCA)
      - name: Frontend Dependency Scan (npm audit)
        working-directory: ./frontend
        run: npm audit --audit-level=high || true

      # 2. Build Image
      - name: Build Frontend Docker Image
        working-directory: ./frontend
        run: docker build -t adilkhan22/twitter-frontend:latest .

      # 3. Container Scanning
      - name: Trivy Container Scan (Frontend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "adilkhan22/twitter-frontend:latest"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"

      # 4. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Push Image to Docker Hub
      - name: Push Frontend Image
        run: docker push adilkhan22/twitter-frontend:latest

  # --- Job 3: Security & Testing ---
  security-and-testing:
    name: Run Tests & Scans
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman (Postman CLI)
        run: npm install -g newman

      - name: Start Backend Server in Background
        working-directory: ./backend
        run: |
          npm install
          npm start &  
          npx wait-on http://localhost:5000/health
        env:
          MONGO_URI: ${{ secrets.TEST_MONGO_URI }}
          JWT_SECRET: "SecretKey"
          PORT: 5000
          NODE_ENV: development

      - name: Run Postman API Tests
        run: |
          newman run ./tests/postman/collection.json \
          -e ./tests/postman/environment.json
