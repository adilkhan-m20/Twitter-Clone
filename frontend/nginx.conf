server {
    listen 80;

    # 1. Serve the React UI for all normal requests
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy any API requests directly to your Kubernetes backend service
    location /api/ {
        # 'backend-service' is the exact name we used in your backend-service.yaml!
        proxy_pass http://backend-service:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}